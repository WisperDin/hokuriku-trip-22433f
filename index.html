<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>十一日本红叶行</title>
<style>
:root {
  --bg-secondary:  #f5f5f7;
  --bg-grouped:    #f2f2f7;
  --bg-elevated:   #ffffff;
  --text-primary:   #1d1d1f;
  --text-secondary: #86868b;
  --text-tertiary:  #aeaeb2;
  --accent:        #0071e3;
  --tint-orange: #ff9500;
  --tint-blue:   #0071e3;
  --tint-red:    #ff3b30;
  --tint-purple: #af52de;
  --separator:  rgba(60, 60, 67, .12);
  --shadow-sm:  0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
  --shadow-md:  0 4px 14px rgba(0,0,0,.08);
  --radius-md:  12px;
  --radius-lg:  18px;
  --safe-top:    env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { background: var(--bg-secondary); }
body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display",
               "PingFang SC", "Helvetica Neue", "Arial", sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  -webkit-font-smoothing: antialiased;
  line-height: 1.47;
  letter-spacing: -0.01em;
  padding: calc(28px + var(--safe-top)) 20px calc(40px + var(--safe-bottom));
}
a { color: inherit; text-decoration: none; }

.wrap { max-width: 640px; margin: 0 auto; }
.hero { margin-bottom: 28px; }
.hero .emoji { font-size: 34px; margin-bottom: 8px; display: block; }
.hero h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 6px; }
.hero .sub { font-size: 15px; color: var(--text-secondary); }

.status-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 28px;
}
.status-card {
  background: var(--bg-elevated); border-radius: var(--radius-md);
  padding: 14px 16px; box-shadow: var(--shadow-sm);
}
.status-card .label { font-size: 11px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 4px; }
.status-card .value { font-size: 14px; font-weight: 600; line-height: 1.4; }

.section-title {
  font-size: 13px; font-weight: 650; color: var(--text-secondary);
  text-transform: uppercase; letter-spacing: .04em; margin: 24px 0 10px 4px;
}

.card-list { display: flex; flex-direction: column; gap: 10px; }
.nav-card {
  display: flex; align-items: center; gap: 14px;
  background: var(--bg-elevated); border-radius: var(--radius-lg);
  padding: 16px 18px; box-shadow: var(--shadow-sm);
  transition: transform .15s ease, box-shadow .15s ease;
}
.nav-card:active { transform: scale(.98); }
.nav-card .icon {
  width: 44px; height: 44px; border-radius: 12px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; font-size: 21px;
}
.nav-card .icon.plan { background: rgba(255,149,0,.14); }
.nav-card .icon.lodging { background: rgba(0,113,227,.12); }
.nav-card .icon.script { background: rgba(175,82,222,.13); }
.nav-card .icon.map { background: rgba(255,59,48,.12); }
.nav-card .body { flex: 1; min-width: 0; }
.nav-card .title { font-size: 16px; font-weight: 650; margin-bottom: 2px; }
.nav-card .desc { font-size: 13px; color: var(--text-secondary); line-height: 1.4; }
.nav-card .chev { color: var(--text-tertiary); font-size: 18px; flex-shrink: 0; }
.nav-card .tag {
  font-size: 11px; font-weight: 650; padding: 2px 8px; border-radius: 980px;
  flex-shrink: 0; white-space: nowrap;
}
.tag.done { background: rgba(52,199,89,.15); color: #1e7e34; }
.tag.todo { background: rgba(255,149,0,.15); color: #a35b00; }

.footer { margin-top: 32px; text-align: center; font-size: 12px; color: var(--text-tertiary); }

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg-secondary: #000; --bg-grouped: #1c1c1e; --bg-elevated: #1c1c1e;
    --text-primary: #f5f5f7; --text-secondary: #98989d; --text-tertiary: #6e6e73;
    --separator: rgba(84,84,88,.6);
  }
}
:root[data-theme="dark"] {
  --bg-secondary: #000; --bg-grouped: #1c1c1e; --bg-elevated: #1c1c1e;
  --text-primary: #f5f5f7; --text-secondary: #98989d; --text-tertiary: #6e6e73;
  --separator: rgba(84,84,88,.6);
}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <span class="emoji">🇯🇵</span>
    <h1>十一日本红叶行</h1>
    <div class="sub">北陆 · 立山黑部 · 上高地　8 天 7 晚　2026/10/1 – 10/8</div>
  </div>

  <div class="status-grid">
    <div class="status-card">
      <div class="label">住宿</div>
      <div class="value">✅ D1 已订<br>⚠️ 6 晚待订</div>
    </div>
    <div class="status-card">
      <div class="label">同行</div>
      <div class="value">共 4 人<br>Flow · AMY · 中华民族 +1</div>
    </div>
    <div class="status-card">
      <div class="label">航班</div>
      <div class="value">HKG↔KMQ<br>去14:35抵·回15:20飞</div>
    </div>
    <div class="status-card">
      <div class="label">最紧迫</div>
      <div class="value">平汤·松本<br>最先卖光</div>
    </div>
  </div>

  <div class="section-title">四份文档</div>
  <div class="card-list">
    <a class="nav-card" href="plan.html">
      <div class="icon plan">📋</div>
      <div class="body">
        <div class="title">旅行计划</div>
        <div class="desc">行程安排 · 住宿条件 · 行李动线 · 待决事项</div>
      </div>
      <div class="chev">›</div>
    </a>
    <a class="nav-card" href="lodging.html">
      <div class="icon lodging">🏨</div>
      <div class="body">
        <div class="title">住宿指南</div>
        <div class="desc">分城市调研 · 候选清单 · 信心程度标注</div>
      </div>
      <div class="chev">›</div>
    </a>
    <a class="nav-card" href="script.html">
      <div class="icon script">🎬</div>
      <div class="body">
        <div class="title">剧本推演</div>
        <div class="desc">逐天流水账 · 衔接检查 · 找出不合理之处</div>
      </div>
      <div class="chev">›</div>
    </a>
    <a class="nav-card" href="map.html">
      <div class="icon map">🗺️</div>
      <div class="body">
        <div class="title">行程地图</div>
        <div class="desc">42 个地点 · 交互式地图 · 导航跳转</div>
      </div>
      <div class="chev">›</div>
    </a>
  </div>

  <div class="footer">最后更新 2026-09-09</div>
</div>
</body>
</html>
